name: Synthetic history demo

on:
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Compressed timeline length in hours"
        required: true
        default: "24"
        type: string
      start_utc:
        description: "Timeline start in UTC (blank = now), e.g. 2026-01-01T00:00:00Z"
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [source-pushed]

permissions:
  contents: write

concurrency:
  group: synthetic-history-demo
  cancel-in-progress: false

jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Git
        run: |
          git --version
          python --version

      - name: Generate and publish synthetic history
        env:
          SOURCE_REPO: https://github.com/epsretriever/spherex-planet-x.git
          DESTINATION_REPO: https://github.com/ESuperCode/squeeze_test.git
          DESTINATION_BRANCH: synthetic-history
          WINDOW_HOURS: ${{ github.event.inputs.window_hours || '24' }}
          START_UTC: ${{ github.event.inputs.start_utc || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python synthetic_history_demo.py --push
