
name: Full Synthetic Git History

on:
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Compressed history duration in hours"
        required: true
        default: "24"
        type: string

      start_utc:
        description: "Timeline start in UTC (blank = 24 hours before run)"
        required: false
        default: ""
        type: string

      identity_mode:
        description: "Synthetic author selection"
        required: true
        default: "bot"
        type: choice
        options:
          - bot
          - one
          - two

      name1:
        description: "Synthetic contributor A name"
        required: true
        default: "Demo Contributor A"
        type: string

      email1:
        description: "Synthetic contributor A email (.invalid required)"
        required: true
        default: "demo-a@example.invalid"
        type: string

      name2:
        description: "Synthetic contributor B name"
        required: true
        default: "Demo Contributor B"
        type: string

      email2:
        description: "Synthetic contributor B email (.invalid required)"
        required: true
        default: "demo-b@example.invalid"
        type: string

      assignment_seed:
        description: "Seed for randomized balanced assignment"
        required: true
        default: "42"
        type: string

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve workflow control branch
        run: |
          git push origin HEAD:refs/heads/history-demo-control

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Git Filter Repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install git-filter-repo

      - name: Reconstruct and publish history
        env:
          SOURCE_REPO: https://github.com/epsretriever/spherex-planet-x.git
          DESTINATION_REPO: https://github.com/ESuperCode/squeeze_test.git

          WINDOW_HOURS: ${{ inputs.window_hours }}
          START_UTC: ${{ inputs.start_utc }}

          IDENTITY_MODE: ${{ inputs.identity_mode }}

          NAME1: ${{ inputs.name1 }}
          EMAIL1: ${{ inputs.email1 }}

          NAME2: ${{ inputs.name2 }}
          EMAIL2: ${{ inputs.email2 }}

          ASSIGNMENT_SEED: ${{ inputs.assignment_seed }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          python full_history_demo.py --push
